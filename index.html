<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifrador y Descifrador de Textos</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #334155;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: #60a5fa;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        textarea, select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        textarea:focus, select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-encrypt {
            background-color: var(--primary);
            color: white;
        }

        .btn-encrypt:hover {
            background-color: var(--primary-hover);
        }

        .btn-decrypt {
            background-color: #475569;
            color: white;
        }

        .btn-decrypt:hover {
            background-color: #64748b;
        }

        .output-section {
            margin-top: 25px;
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 35px;
            right: 10px;
            background: var(--border);
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔐 Cifrador Web</h1>
        
        <div class="form-group">
            <label for="inputText">Texto de entrada:</label>
            <textarea id="inputText" placeholder="Escribe tu texto aquí..."></textarea>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="cipherType">Método de cifrado:</label>
                <select id="cipherType" onchange="toggleExtraFields()">
                    <option value="base64">Base64 (Codificación)</option>
                    <option value="caesar">Cifrado César</option>
                    <option value="xor">Cifrado XOR (Clave)</option>
                </select>
            </div>

            <div class="form-group" id="extraFieldContainer">
                <label for="extraParam" id="extraLabel">Desplazamiento (César):</label>
                <input type="number" id="extraParam" value="3">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-encrypt" onclick="processText('encrypt')">Cifrar</button>
            <button class="btn-decrypt" onclick="processText('decrypt')">Descifrar</button>
        </div>

        <div class="output-section">
            <label for="outputText">Resultado:</label>
            <button class="copy-btn" onclick="copyResult()">Copiar</button>
            <textarea id="outputText" readonly placeholder="El resultado aparecerá aquí..."></textarea>
        </div>
    </div>

    <script>
        function toggleExtraFields() {
            const cipherType = document.getElementById('cipherType').value;
            const extraLabel = document.getElementById('extraLabel');
            const extraParam = document.getElementById('extraParam');
            const container = document.getElementById('extraFieldContainer');

            if (cipherType === 'base64') {
                container.style.display = 'none';
            } else {
                container.style.display = 'block';
                if (cipherType === 'caesar') {
                    extraLabel.innerText = 'Desplazamiento (Número):';
                    extraParam.type = 'number';
                    extraParam.value = 3;
                } else if (cipherType === 'xor') {
                    extraLabel.innerText = 'Clave secreta (Texto):';
                    extraParam.type = 'text';
                    extraParam.value = 'mi_clave';
                }
            }
        }

        function processText(action) {
            const text = document.getElementById('inputText').value;
            const cipherType = document.getElementById('cipherType').value;
            const param = document.getElementById('extraParam').value;
            let result = '';

            if (!text) {
                document.getElementById('outputText').value = 'Por favor, ingresa algún texto.';
                return;
            }

            try {
                if (cipherType === 'base64') {
                    if (action === 'encrypt') {
                        result = btoa(unescape(encodeURIComponent(text)));
                    } else {
                        result = decodeURIComponent(escape(atob(text)));
                    }
                } 
                else if (cipherType === 'caesar') {
                    let shift = parseInt(param) || 0;
                    if (action === 'decrypt') shift = -shift;
                    result = caesarCipher(text, shift);
                } 
                else if (cipherType === 'xor') {
                    let key = param || 'default';
                    result = xorCipher(text, key);
                }
                
                document.getElementById('outputText').value = result;
            } catch (error) {
                document.getElementById('outputText').value = 'Error: Entrada no válida para descifrar.';
            }
        }

        function caesarCipher(str, shift) {
            return str.split('').map(char => {
                let code = char.charCodeAt(0);
                // Mayúsculas
                if (code >= 65 && code <= 90) {
                    return String.fromCharCode(((code - 65 + shift) % 26 + 26) % 26 + 65);
                }
                // Minúsculas
                else if (code >= 97 && code <= 122) {
                    return String.fromCharCode(((code - 97 + shift) % 26 + 26) % 26 + 97);
                }
                return char;
            }).join('');
        }

        function xorCipher(str, key) {
            let output = '';
            for (let i = 0; i < str.length; i++) {
                output += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return output;
        }

        function copyResult() {
            const outputText = document.getElementById('outputText');
            outputText.select();
            document.execCommand('copy');
            alert('¡Resultado copiado al portapapeles!');
        }

        // Inicializar vista
        toggleExtraFields();
    </script>
</body>
</html>
