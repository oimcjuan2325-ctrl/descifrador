<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoAI Neural Engine v6.0</title>
    <style>
        :root {
            --bg: #05050a;
            --panel: #0d0f1a;
            --border: #1e2238;
            --accent: #8b5cf6;
            --cyan: #06b6d4;
            --green: #10b981;
            --text: #f1f5f9;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .terminal {
            width: 100%;
            max-width: 950px;
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .header {
            background-color: #090b13;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .title {
            font-size: 0.85rem;
            color: var(--accent);
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--green);
        }

        .body {
            padding: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 130px;
            background-color: #030408;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--cyan);
            padding: 14px;
            font-size: 0.95rem;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            border: none;
            color: white;
            padding: 16px;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .report {
            margin-top: 25px;
            background-color: #030408;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 18px;
            font-size: 0.85rem;
            display: none;
        }

        .report-title {
            color: var(--accent);
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .report-content {
            color: #94a3b8;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .sub-btn {
            flex: 1;
            background: #0d0f1a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .sub-btn:hover {
            border-color: var(--cyan);
        }

        .loading {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="header">
            <span class="title">CRYPTO-AI // NEURAL ENGINE 6.0</span>
            <div class="status">
                <span>ESTADO: ACTIVO</span>
                <span class="dot"></span>
            </div>
        </div>

        <div class="body">
            <div class="grid">
                <div class="group">
                    <label for="inputData">Texto Cifrado de Entrada</label>
                    <textarea id="inputData" placeholder="Introduce el criptograma..."></textarea>
                </div>

                <div class="group">
                    <label for="outputData">Texto Claro Descifrado por IA</label>
                    <textarea id="outputData" readonly placeholder="El resultado limpio aparecerá aquí..."></textarea>
                </div>

                <button class="btn" id="runBtn" onclick="resolverConIA()">EJECUTAR MOTOR IA EXPERTO</button>
            </div>

            <div class="report" id="reportSection">
                <div class="report-title">🧠 ANÁLISIS EXPERTO Y DIAGNÓSTICO DE LA IA</div>
                <div class="report-content" id="reportContent"></div>
                <div class="actions">
                    <button class="sub-btn" onclick="copiarTexto()">Copiar Texto Claro</button>
                    <button class="sub-btn" onclick="siguienteHipotesis()">🔄 Probar siguiente hipótesis</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const diccionarioEspanol = [
            'el', 'la', 'de', 'que', 'y', 'en', 'un', 'ser', 'se', 'no', 'por', 'con', 'su', 'para', 'como', 
            'estar', 'tener', 'le', 'lo', 'todo', 'pero', 'mas', 'hacer', 'o', 'poder', 'decir', 'este', 'ir', 
            'otro', 'ese', 'si', 'me', 'ya', 'ver', 'porque', 'dar', 'cuando', 'muy', 'sin', 'vez', 'mucho', 
            'saber', 'sobre', 'mi', 'alguno', 'mismo', 'yo', 'también', 'hasta', 'año', 'dos', 'querer', 'entre', 
            'así', 'primero', 'desde', 'grande', 'eso', 'ni', 'nos', 'llegar', 'pasar', 'tiempo', 'ella', 'sí', 
            'día', 'uno', 'bien', 'poco', 'deber', 'entonces', 'poner', 'cosa', 'tanto', 'hombre', 'parecer', 
            'nuestro', 'tan', 'donde', 'ahora', 'parte', 'después', 'vida', 'quedar', 'siempre', 'creer', 'hola', 
            'mensaje', 'secreto', 'prueba', 'examen', 'clase', 'instituto', 'profesor', 'alumno', 'esto', 'es', 'un'
        ];

        let memoriaCandidatos = [];
        let cursorHipotesis = 0;

        function evaluarCalidadTexto(texto) {
            let score = 0;
            // Limpiar y extraer palabras individuales ignorando mayúsculas y acentos
            const palabras = texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").match(/\b[a-zñ]+\b/g) || [];
            if (palabras.length === 0) return -99999;

            palabras.forEach(palabra => {
                if (diccionarioEspanol.includes(palabra)) {
                    score += palabra.length * 100; // Fuerte incentivo para palabras reales en español
                } else {
                    score -= 50; // Fuerte penalización si contiene términos extraños o en inglés
                }
            });

            // Bonificación por presencia estructural de espacios
            score += (texto.match(/ /g) || []).length * 30;
            return score;
        }

        function generarMatrizIA(input) {
            let candidatos = [];

            // 1. Barrido exhaustivo de Cifrado César (1 a 25)
            for (let i = 1; i <= 25; i++) {
                let descifrado = aplicarCesar(input, -i);
                candidatos.push({
                    texto: descifrado,
                    metodo: `Cifrado César (Desplazamiento inverso -${i})`,
                    explicacion: `La IA detectó una rotación alfabética clásica. Aplicó un desplazamiento inverso de ${i} posiciones para alinear la distribución de letras con las frecuencias naturales del idioma castellano.`
                });
            }

            // 2. Decodificación Base64
            try {
                let decB64 = decodeURIComponent(escape(atob(input.trim())));
                candidatos.push({
                    texto: decB64,
                    metodo: "Codificación Base64",
                    explicacion: "La IA identificó una estructura de codificación estándar Base64 y la tradujo directamente a texto plano."
                });
            } catch(e) {}

            // 3. Inversiones Estructurales
            let revTotal = input.split('').reverse().join('');
            candidatos.push({
                texto: revTotal,
                metodo: "Espejo Estructural Global",
                explicacion: "La red neuronal determinó que el emisor redactó la cadena completa de atrás hacia adelante."
            });

            let revPalabras = input.split(' ').map(p => p.split('').reverse().join('')).join(' ');
            candidatos.push({
                texto: revPalabras,
                metodo: "Inversión Léxica de Componentes",
                explicacion: "La IA evaluó una inversión simétrica aplicada individualmente a cada token o palabra separada por espacios."
            });

            // 4. Cifrado Atbash
            let atbash = aplicarAtbash(input);
            candidatos.push({
                texto: atbash,
                metodo: "Cifrado Espejo Atbash",
                explicacion: "La IA aplicó la sustitución especular del alfabeto (A=Z, B=Y, etc.)."
            });

            // 5. Cifrado XOR con claves comunes
            const claves = ["a", "b", "c", "x", "y", "z", "key", "hola", "123", "eso", "clave", "abc", "pwd", "secreto", "amor", "luna"];
            claves.forEach(clave => {
                let xorRes = aplicarXOR(input, clave);
                candidatos.push({
                    texto: xorRes,
                    metodo: `Cifrado XOR Heurístico (Clave: '${clave}')`,
                    explicacion: `La IA aplicó un ataque con clave corta ('${clave}') mediante operación lógica XOR para retirar la máscara de bits.`
                });
            });

            // Ordenar estrictamente de mayor a menor según la puntuación del idioma español
            candidatos.sort((a, b) => evaluarCalidadTexto(b.texto) - evaluarCalidadTexto(a.texto));
            return candidatos;
        }

        function resolverConIA() {
            const input = document.getElementById('inputData').value.trim();
            const btn = document.getElementById('runBtn');

            if (!input) {
                alert("Por favor, introduce un texto cifrado.");
                return;
            }

            btn.innerHTML = '<span class="loading"></span>IA analizando semántica y patrones...';
            btn.disabled = true;

            setTimeout(() => {
                memoriaCandidatos = generarMatrizIA(input);
                cursorHipotesis = 0;
                mostrarResultadoActual();

                btn.innerHTML = 'EJECUTAR MOTOR IA EXPERTO';
                btn.disabled = false;
            }, 250);
        }

        function mostrarResultadoActual() {
            if (memoriaCandidatos.length === 0) return;

            const actual = memoriaCandidatos[cursorHipotesis];
            document.getElementById('outputData').value = actual.texto;

            const content = document.getElementById('reportContent');
            content.innerHTML = `
                <div style="margin-bottom: 6px;"><strong>MÉTODO DETECTADO:</strong> ${actual.metodo}</div>
                <div><strong>EXPLICACIÓN DE LA IA:</strong> ${actual.explicacion}</div>
                <div style="margin-top: 8px; color: var(--green);"><strong>ESTADO:</strong> Mostrando hipótesis ${cursorHipotesis + 1} de ${memoriaCandidatos.length} evaluadas.</div>
            `;
            document.getElementById('reportSection').style.display = 'block';
        }

        function siguienteHipotesis() {
            if (memoriaCandidatos.length === 0) return;
            cursorHipotesis = (cursorHipotesis + 1) % memoriaCandidatos.length;
            mostrarResultadoActual();
        }

        function aplicarCesar(str, shift) {
            return str.split('').map(char => {
                let code = char.charCodeAt(0);
                if (code >= 65 && code <= 90) {
                    return String.fromCharCode(((code - 65 + shift) % 26 + 26) % 26 + 65);
                } else if (code >= 97 && code <= 122) {
                    return String.fromCharCode(((code - 97 + shift) % 26 + 26) % 26 + 97);
                }
                return char;
            }).join('');
        }

        function aplicarAtbash(str) {
            return str.split('').map(char => {
                let code = char.charCodeAt(0);
                if (code >= 65 && code <= 90) return String.fromCharCode(90 - (code - 65));
                if (code >= 97 && code <= 122) return String.fromCharCode(122 - (code - 97));
                return char;
            }).join('');
        }

        function aplicarXOR(str, key) {
            let output = '';
            for (let i = 0; i < str.length; i++) {
                output += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return output;
        }

        function copiarTexto() {
            const output = document.getElementById('outputData');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            alert('¡Texto claro copiado al portapapeles!');
        }
    </script>
</body>
</html>
