<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CriptoAnalizador Pro - Versión Refinada</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border: #374151;
            --accent: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 750px;
            border: 1px solid var(--border);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 2rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #d1d5db;
        }

        textarea {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: #030712;
            color: var(--text-color);
            font-size: 1rem;
            resize: vertical;
            height: 110px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-main {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            transition: filter 0.2s;
        }

        .btn-main:hover {
            filter: brightness(1.1);
        }

        .output-section {
            margin-top: 25px;
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 36px;
            right: 12px;
            background: var(--border);
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: var(--primary);
        }

        .explanation-box {
            margin-top: 20px;
            background-color: #030712;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            font-size: 0.9rem;
            color: #9ca3af;
        }

        .explanation-box h3 {
            color: #34d399;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .next-btn {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background-color: #1f2937;
            border: 1px solid #4b5563;
            color: #f3f4f6;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .next-btn:hover {
            background-color: #374151;
            border-color: var(--primary);
        }

        .ai-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 CriptoIA Refinada</h1>
        <p class="subtitle">Motor local con optimización lingüística estricta en castellano</p>
        
        <div class="form-group">
            <label for="inputText">Introduce el texto cifrado:</label>
            <textarea id="inputText" placeholder="Pega aquí el mensaje oculto..."></textarea>
        </div>

        <button class="btn-main" onclick="analizarConIA()">Ejecutar Descifrado Inteligente</button>

        <div class="output-section">
            <label for="outputText">Texto Descifrado:</label>
            <button class="copy-btn" onclick="copiarTexto()">Copiar</button>
            <textarea id="outputText" readonly placeholder="El resultado aparecerá aquí..."></textarea>
        </div>

        <div class="explanation-box" id="explanationBox" style="display: none;">
            <div class="ai-badge">ESTADO: ANÁLISIS LINGÜÍSTICO ACTIVO</div>
            <h3>🧠 Razonamiento de la IA</h3>
            <div id="explanationContent"></div>
            <button class="next-btn" id="nextBtn" onclick="probarSiguienteEstrategiaIA()">🔄 ¿No es correcto? Probar siguiente hipótesis</button>
        </div>
    </div>

    <script>
        // Diccionario estricto en castellano con exclusión de términos en inglés
        const spanishWords = ['el', 'la', 'de', 'que', 'y', 'en', 'un', 'es', 'se', 'no', 'por', 'con', 'su', 'para', 'como', 'estar', 'tener', 'le', 'lo', 'todo', 'pero', 'mas', 'hacer', 'o', 'poder', 'decir', 'este', 'ir', 'otro', 'ese', 'si', 'me', 'ya', 'ver', 'porque', 'dar', 'cuando', 'muy', 'sin', 'vez', 'mucho', 'saber', 'sobre', 'mi', 'alguno', 'mismo', 'yo', 'también', 'hasta', 'año', 'dos', 'querer', 'entre', 'así', 'primero', 'desde', 'grande', 'eso', 'ni', 'nos', 'llegar', 'pasar', 'tiempo', 'ella', 'sí', 'día', 'uno', 'bien', 'poco', 'deber', 'entonces', 'poner', 'cosa', 'tanto', 'hombre', 'parecer', 'nuestro', 'tan', 'donde', 'ahora', 'parte', 'después', 'vida', 'quedar', 'siempre', 'creer', 'mensaje', 'secreto', 'prueba'];

        let memoriaIA = [];
        let iteracionIA = 0;

        function evaluarCoherencia(texto) {
            let score = 0;
            const palabras = texto.toLowerCase().match(/\b[a-zñáéíóú]+\b/g) || [];
            if (palabras.length === 0) return -999;
            
            palabras.forEach(palabra => {
                if (spanishWords.includes(palabra)) {
                    score += palabra.length * 30; // Alta puntuación para palabras reales en español
                } else {
                    score -= 5; // Penaliza palabras extrañas o en inglés para evitar falsos positivos
                }
            });
            score += (texto.match(/ /g) || []).length * 10;
            return score;
        }

        function generarHipotesisIA(input) {
            let hipotesis = [];

            // 1. Barrido automatizado prioritario de Cifrado César (1 a 25)
            for (let i = 1; i <= 25; i++) {
                let cesarRes = aplicarCesar(input, -i);
                hipotesis.push({ 
                    texto: cesarRes, 
                    metodo: `Cifrado César (Desplazamiento inverso -${i})`, 
                    razon: `La IA aplicó un desplazamiento alfabético de ${i} posiciones evaluando la concordancia léxica en castellano.` 
                });
            }

            // 2. Decodificación Base64
            try {
                let decB64 = decodeURIComponent(escape(atob(input)));
                hipotesis.push({ texto: decB64, metodo: "Decodificación Base64", razon: "Se identificó una estructura de codificación estándar Base64." });
            } catch(e) {}

            // 3. Inversiones
            let revTotal = input.split('').reverse().join('');
            hipotesis.push({ texto: revTotal, metodo: "Inversión Estructural Completa", razon: "El mensaje completo estaba redactado en sentido inverso." });

            let revPalabras = input.split(' ').map(p => p.split('').reverse().join('')).join(' ');
            hipotesis.push({ texto: revPalabras, metodo: "Inversión por Palabras", razon: "Cada palabra estaba invertida de forma individual." });

            // Ordenar por coherencia estricta en español de mayor a menor
            hipotesis.sort((a, b) => evaluarCoherencia(b.texto) - evaluarCoherencia(a.texto));
            return hipotesis;
        }

        function analizarConIA() {
            const input = document.getElementById('inputText').value.trim();
            if (!input) {
                alert("Por favor, introduce un texto cifrado.");
                return;
            }

            memoriaIA = generarHipotesisIA(input);
            iteracionIA = 0;
            renderizarResultadoIA();
        }

        function renderizarResultadoIA() {
            if (memoriaIA.length === 0) return;

            const current = memoriaIA[iteracionIA];
            document.getElementById('outputText').value = current.texto;

            const content = document.getElementById('explanationContent');
            content.innerHTML = `
                <p><strong>Estrategia aplicada (${iteracionIA + 1}/${memoriaIA.length}):</strong> ${current.metodo}</p>
                <p style="margin-top: 6px;"><strong>Análisis del modelo:</strong> ${current.razon}</p>
            `;
            document.getElementById('explanationBox').style.display = 'block';
        }

        function probarSiguienteEstrategiaIA() {
            if (memoriaIA.length === 0) return;
            iteracionIA = (iteracionIA + 1) % memoriaIA.length;
            renderizarResultadoIA();
        }

        function aplicarCesar(str, shift) {
            return str.split('').map(char => {
                let code = char.charCodeAt(0);
                if (code >= 65 && code <= 90) {
                    return String.fromCharCode(((code - 65 + shift) % 26 + 26) % 26 + 65);
                } else if (code >= 97 && code <= 122) {
                    return String.fromCharCode(((code - 97 + shift) % 26 + 26) % 26 + 97);
                }
                return char;
            }).join('');
        }

        function copiarTexto() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) return;
            outputText.select();
            document.execCommand('copy');
            alert('¡Texto copiado al portapapeles!');
        }
    </script>
</body>
</html>
